services:
  # ==================== 基础设施（Docker） ====================

  # 1. PostgreSQL 数据库
  postgresql:
    image: postgres:15-alpine
    container_name: temporal-postgresql
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 2. Temporal Server (auto-setup内置schema初始化)
  temporal:
    image: temporalio/auto-setup:1.27.3
    container_name: temporal-server
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/docker.yaml
      - LOG_LEVEL=error,warn,info
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ./dynamicconfig/docker.yaml:/etc/temporal/config/dynamicconfig/docker.yaml
    restart: unless-stopped

  # ==================== Temporal Workers (Docker, 指向本地 mokapi) ====================

  # 场景1 Worker: 海量并发与限流
  worker-scenario1:
    build:
      context: ../temporal-workers
      dockerfile: Dockerfile
    container_name: worker-scenario1
    environment:
      - TEMPORAL_ADDRESS=host.docker.internal:7233
      - HIK_API_URL=http://host.docker.internal:19090/api/hikvision/verify
      - WEBHOOK_CALLBACK_URL=http://host.docker.internal:19090/api/webhook/callback
      - WORKER_SCENARIOS=scenario1
    depends_on:
      - temporal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 场景2 Worker: 第三方接口重试
  worker-scenario2:
    build:
      context: ../temporal-workers
      dockerfile: Dockerfile
    container_name: worker-scenario2
    environment:
      - TEMPORAL_ADDRESS=host.docker.internal:7233
      - HIK_API_URL=http://host.docker.internal:19090/api/hikvision/verify
      - WEBHOOK_CALLBACK_URL=http://host.docker.internal:19090/api/webhook/callback
      - WORKER_SCENARIOS=scenario2
    depends_on:
      - temporal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 场景3 Worker: 断点续传
  worker-scenario3:
    build:
      context: ../temporal-workers
      dockerfile: Dockerfile
    container_name: worker-scenario3
    environment:
      - TEMPORAL_ADDRESS=host.docker.internal:7233
      - HIK_API_URL=http://host.docker.internal:19090/api/hikvision/verify
      - WEBHOOK_CALLBACK_URL=http://host.docker.internal:19090/api/webhook/callback
      - WORKER_SCENARIOS=scenario3
    depends_on:
      - temporal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 场景4 Worker: 长等待与Signal
  worker-scenario4:
    build:
      context: ../temporal-workers
      dockerfile: Dockerfile
    container_name: worker-scenario4
    environment:
      - TEMPORAL_ADDRESS=host.docker.internal:7233
      - HIK_API_URL=http://host.docker.internal:19090/api/hikvision/verify
      - WEBHOOK_CALLBACK_URL=http://host.docker.internal:19090/api/webhook/callback
      - WORKER_SCENARIOS=scenario4
    depends_on:
      - temporal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 场景5 Worker: Webhook回调
  worker-scenario5:
    build:
      context: ../temporal-workers
      dockerfile: Dockerfile
    container_name: worker-scenario5
    environment:
      - TEMPORAL_ADDRESS=host.docker.internal:7233
      - HIK_API_URL=http://host.docker.internal:19090/api/hikvision/verify
      - WEBHOOK_CALLBACK_URL=http://host.docker.internal:19090/api/webhook/callback
      - WORKER_SCENARIOS=scenario5
    depends_on:
      - temporal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres_data:
